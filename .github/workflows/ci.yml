name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run site checks
        run: npm test
      - name: Ensure Chrome is available for Lighthouse CI
        # GitHub-hosted ubuntu-latest runners ship with google-chrome-stable
        # preinstalled, which chrome-launcher (used by @lhci/cli) auto-detects.
        # This step is a safety net in case that ever changes, without adding
        # a puppeteer dependency just to fetch a browser Chrome already has.
        run: |
          if ! command -v google-chrome-stable >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable
          fi
      - name: Run Lighthouse CI
        run: npm run test:lighthouse
      - name: Check PHP syntax
        run: |
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(
            find scripts web -type f -name '*.php' \
              ! -path 'web/lib/*' \
              ! -path 'web/mail-config.php' -print0
          )
      - name: Check generated output
        # sitemap.xml's <lastmod> is excluded: it's derived from `git log`,
        # whose result depends on which commit is checked out (e.g. GitHub's
        # synthetic PR merge commit), so it can legitimately differ from a
        # local build even with no manual edit. Its <loc> entries are still
        # covered by tests/seo.spec.js.
        run: git diff --exit-code -- web/ ':(exclude)web/sitemap.xml'
